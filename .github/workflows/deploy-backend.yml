name: Deploy Backend to AWS Lambda (CI/CD)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'template.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Build with AWS SAM
        run: sam build

      - name: Deploy with AWS SAM (Free Tier Serverless)
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name dhakreystock-backend \
            --resolve-s3 \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM

      - name: Output API Gateway HTTPS Endpoint
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name dhakreystock-backend \
            --region ${{ secrets.AWS_REGION || 'ap-south-1' }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)
          echo "=========================================================="
          echo "🚀 Your Live API Gateway URL is: $API_URL"
          echo "=========================================================="
          echo "### 🚀 Backend Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "**Live HTTPS API Gateway URL:**" >> $GITHUB_STEP_SUMMARY
          echo "\`$API_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 Copy this URL and paste it into AWS Amplify as \`VITE_API_BASE_URL\`." >> $GITHUB_STEP_SUMMARY

