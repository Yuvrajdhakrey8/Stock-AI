name: Build Android APK (CI/CD)

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web App & Sync Capacitor
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://uwztv3c9l6.execute-api.ap-south-1.amazonaws.com
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Ensure Release Keystore Exists
        working-directory: frontend/android
        run: |
          if [ ! -f dhakreystock-release.jks ]; then
            keytool -genkeypair -v \
              -keystore dhakreystock-release.jks \
              -alias dhakreystock \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass dhakreystock2026 \
              -keypass dhakreystock2026 \
              -dname "CN=DhakreyStock, OU=Mobile, O=Dhakrey, L=Delhi, ST=Delhi, C=IN"
          fi

      - name: Build Android APK and App Bundle (Release Signed)
        working-directory: frontend/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Package Artifacts
        run: |
          cp frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk DhakreyStock-AI.apk 2>/dev/null || cp frontend/android/app/build/outputs/apk/release/app-release.apk DhakreyStock-AI.apk
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab DhakreyStock-AI.aab

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DhakreyStock-AI-APK
          path: DhakreyStock-AI.apk
          retention-days: 30

      - name: Upload AAB as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DhakreyStock-AI-AAB
          path: DhakreyStock-AI.aab
          retention-days: 30

      - name: Persist Release Keystore to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f frontend/android/dhakreystock-release.jks ] && ! git ls-files --error-unmatch frontend/android/dhakreystock-release.jks > /dev/null 2>&1; then
            git add frontend/android/dhakreystock-release.jks
            git commit -m "chore: persist release signing keystore for Play Store"
            git push origin main || true
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: mobile-latest
          name: "DhakreyStock AI Mobile APK & Play Store Bundle"
          body: |
            Latest compiled mobile packages for DhakreyStock AI:
            - **`DhakreyStock-AI.apk`**: Direct installable APK for Android phones (Testing).
            - **`DhakreyStock-AI.aab`**: Official Release-Signed Android App Bundle for Google Play Console submission.
          draft: false
          prerelease: false
          files: |
            DhakreyStock-AI.apk
            DhakreyStock-AI.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
