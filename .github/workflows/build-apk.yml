name: Build Android APK (CI/CD)

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web App & Sync Capacitor
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://uwztv3c9l6.execute-api.ap-south-1.amazonaws.com
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android APK and App Bundle (AAB)
        working-directory: frontend/android
        run: ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Package Artifacts
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk DhakreyStock-AI.apk
          cp frontend/android/app/build/outputs/bundle/debug/app-debug.aab DhakreyStock-AI.aab

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DhakreyStock-AI-APK
          path: DhakreyStock-AI.apk
          retention-days: 30

      - name: Upload AAB as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DhakreyStock-AI-AAB
          path: DhakreyStock-AI.aab
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: mobile-latest
          name: "DhakreyStock AI Mobile APK & Play Store Bundle"
          body: |
            Latest compiled mobile packages for DhakreyStock AI:
            - **`DhakreyStock-AI.apk`**: Direct installable APK for Android phones (Testing).
            - **`DhakreyStock-AI.aab`**: Official Android App Bundle for Google Play Console submission.
          draft: false
          prerelease: false
          files: |
            DhakreyStock-AI.apk
            DhakreyStock-AI.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
